<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">João Pedro — Software Engineering Student and Founder of JPC LAB</title>
  <desc id="desc">Animated developer profile banner with a terminal-inspired typing sequence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="0.52" stop-color="#0a1030"/>
      <stop offset="1" stop-color="#12072e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#22d3ee"/>
      <stop offset="0.48" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="glowCyan">
      <stop stop-color="#22d3ee" stop-opacity=".26"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet">
      <stop stop-color="#8b5cf6" stop-opacity=".28"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#8aa4d8" stroke-opacity=".07"/>
    </pattern>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".48"/>
    </filter>
    <style>
      .cursor{animation:blink 1s step-end infinite}
      .pulse{animation:pulse 3s ease-in-out infinite}
      @keyframes blink{50%{opacity:0}}
      @keyframes pulse{50%{opacity:.35}}
      @media (prefers-reduced-motion:reduce){
        .type1{opacity:1!important}.type2,.type3,.type4{display:none}.cursor,.pulse{animation:none}
      }
    </style>
  </defs>
  <rect width="1200" height="460" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="460" rx="28" fill="url(#grid)"/>
  <circle cx="105" cy="84" r="250" fill="url(#glowCyan)" filter="url(#soft)"/>
  <circle cx="1084" cy="380" r="300" fill="url(#glowViolet)" filter="url(#soft)"/>
  <path d="M60 106C176 27 271 162 394 82S637 44 733 95" fill="none" stroke="url(#accent)" stroke-opacity=".25" stroke-width="2"/>
  <g opacity=".55" fill="#0a1030" stroke="#48d7f2">
    <circle cx="60" cy="106" r="5"/><circle cx="206" cy="78" r="5"/><circle cx="394" cy="82" r="5"/><circle cx="576" cy="58" r="5"/><circle cx="733" cy="95" r="5"/>
  </g>
  <g transform="translate(70 72)" filter="url(#shadow)">
    <rect width="1060" height="322" rx="22" fill="#080d22" fill-opacity=".9" stroke="#7aa2ff" stroke-opacity=".22"/>
    <rect width="1060" height="52" rx="22" fill="#111936"/>
    <path d="M0 52h1060" stroke="#7aa2ff" stroke-opacity=".16"/>
    <circle cx="26" cy="26" r="6" fill="#fb7185"/><circle cx="48" cy="26" r="6" fill="#fbbf24"/><circle cx="70" cy="26" r="6" fill="#34d399"/>
    <text x="530" y="32" text-anchor="middle" fill="#8ea1c8" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14">joao@jpclab: ~/build/next</text>
  </g>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="120" y="176" fill="#8fa9dd" font-size="18" font-weight="600" letter-spacing="4">FOUNDER · BUILDER · STUDENT</text>
    <text x="120" y="255" fill="#f7f9ff" font-size="74" font-weight="800" letter-spacing="2">JOÃO PEDRO</text>
    <rect x="120" y="277" width="534" height="4" rx="2" fill="url(#accent)"/>
    <text x="120" y="338" fill="#42d9f5" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="25" font-weight="700">&gt;_</text>
    <text class="type1" x="190" y="338" fill="#dce8ff" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="24" opacity="1">Software Engineering Student<animate attributeName="opacity" dur="16s" repeatCount="indefinite" values="1;1;0;0;0" keyTimes="0;.22;.24;.99;1"/></text>
    <text class="type2" x="190" y="338" fill="#dce8ff" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="24" opacity="0">Building SaaS &amp; Mobile Products<animate attributeName="opacity" dur="16s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.24;.26;.47;.49;1"/></text>
    <text class="type3" x="190" y="338" fill="#dce8ff" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="24" opacity="0">Founder @ JPC LAB<animate attributeName="opacity" dur="16s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.49;.51;.72;.74;1"/></text>
    <text class="type4" x="190" y="338" fill="#dce8ff" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="24" opacity="0">Passionate About Technology<animate attributeName="opacity" dur="16s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;.74;.76;.98;1"/></text>
    <rect class="cursor" x="624" y="315" width="3" height="30" fill="#a855f7"/>
    <text x="120" y="381" fill="#8095bd" font-size="15" letter-spacing="1">BRAZIL  /  WEB · MOBILE · SAAS  /  JPC LAB</text>
  </g>
  <g transform="translate(925 154)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-44 30-79 65l35 35M44 30l35 35-35 35" stroke="#22d3ee" stroke-width="9" opacity=".95"/>
    <path d="M18 12-16 117" stroke="#a855f7" stroke-width="9" opacity=".95"/>
    <circle class="pulse" cx="0" cy="65" r="88" stroke="#6386ff" stroke-opacity=".36" stroke-width="2"/>
    <circle cx="0" cy="65" r="111" stroke="#6386ff" stroke-opacity=".14"/>
  </g>
  <rect x="1" y="1" width="1198" height="458" rx="27" fill="none" stroke="url(#accent)" stroke-opacity=".35" stroke-width="2"/>
</svg>
